name = "staffnow-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Bundle TTF font binaries into the worker so we can render Greek text in PDFs.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# Native Rate Limiting binding (no KV writes). Global limiter: 120 req / 60s per IP.
# ΠΡΟΣΟΧΗ: μετριέται ανά IP, όχι ανά χρήστη — δύο υπάλληλοι στο ίδιο wifi ή ένας
# χρήστης με δύο καρτέλες μοιράζονται το ίδιο σύνολο. Στα 60 μπλόκαραν κανονικοί
# χρήστες. Η πραγματική προστασία σύνδεσης/κωδικού γίνεται στο rate-limiter.ts.
# NOTE: unsafe bindings are NOT inherited by named environments, so they are
# re-declared under [env.staging] and [env.production] with distinct namespace_ids.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:3002,http://localhost:3000,http://127.0.0.1:3002"
API_URL = "http://localhost:8787"
# Off-site notifications (Web Push + Email).
#   VAPID_PUBLIC_KEY  — public key clients subscribe with (must match the web
#                       app's NEXT_PUBLIC_VAPID_PUBLIC_KEY). Non-secret.
#   VAPID_SUBJECT     — VAPID contact (mailto: or https URL). Non-secret.
#   EMAIL_FROM        — verified Resend sender. Non-secret.
# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   VAPID_PRIVATE_KEY, EMAIL_API_KEY
# Generate a VAPID keypair once with: npx web-push generate-vapid-keys
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:no-reply@staffnow.gr"
EMAIL_FROM = "StaffNow <no-reply@staffnow.gr>"

[[d1_databases]]
binding = "DB"
database_name = "staffnow-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "staffnow-uploads"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# Workers AI — free tier (10k neurons/day), then pay-per-use
[ai]
binding = "AI"

# Scheduled triggers
#   03:15 UTC daily — billing maintenance (grace-period downgrades + manual transfer expiry)
[triggers]
# "15 3 * * *" = ημερήσιο (billing). "5 * * * *" = ωριαίο (αρχειοθέτηση
# βαρδιών που ξεκίνησαν). Το DAILY_CRON στο src/index.ts πρέπει να ταιριάζει.
crons = ["15 3 * * *", "5 * * * *"]

[env.staging]
vars = { ENVIRONMENT = "staging", CORS_ORIGIN = "https://staging.staffnow.gr", API_URL = "https://api-staging.staffnow.gr", VAPID_PUBLIC_KEY = "", VAPID_SUBJECT = "mailto:no-reply@staffnow.gr", EMAIL_FROM = "StaffNow <no-reply@staffnow.gr>" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "staffnow-db-staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "staffnow-uploads-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "YOUR_STAGING_KV_NAMESPACE_ID"

[[env.staging.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[env.production]
vars = { ENVIRONMENT = "production", CORS_ORIGIN = "https://staffnow.gr,https://www.staffnow.gr,https://staffnow.pages.dev", API_URL = "https://api.staffnow.gr", VAPID_PUBLIC_KEY = "BNb1lsiiSlXtF3fztALP1F0h9MenWZVqWnWTVQrSUoHuZVkH_-QEE2sXMXg4xs5Xfa4DmFSiO0-rHTCyEBySjMk", VAPID_SUBJECT = "mailto:no-reply@staffnow.gr", EMAIL_FROM = "StaffNow <no-reply@staffnow.gr>" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "staffnow-db-prod"
database_id = "3d2a719f-5899-4e44-97bf-f4d76f18cd81"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "staffnow-uploads-prod"

[[env.production.kv_namespaces]]
binding = "KV"
id = "817d9666ea2e46288a31b02d6a914a10"

[env.production.ai]
binding = "AI"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
