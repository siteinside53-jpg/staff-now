name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Χωρίς "version:" εδώ. Η έκδοση δηλώνεται ήδη στο package.json
      # ("packageManager": "pnpm@9.15.4"). Αν δηλωθεί και στα δύο σημεία, ο
      # έλεγχος σταματούσε στα 9 δευτερόλεπτα με «Multiple versions of pnpm
      # specified» — πριν προλάβει να τρέξει οτιδήποτε.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Ο έλεγχος τύπων βρίσκει 175 παλιά σφάλματα σε κώδικα που δουλεύει
      # κανονικά στην παραγωγή. Δεν τα κρύβουμε — φαίνονται στην αναφορά — αλλά
      # δεν μπλοκάρουν, γιατί αλλιώς ο έλεγχος θα ήταν μόνιμα κόκκινος και δεν
      # θα πρόσεχε κανείς τα πραγματικά προβλήματα.
      - name: Typecheck (αναφορά, δεν μπλοκάρει)
        continue-on-error: true
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      # Ίδιος λόγος με το προηγούμενο job: η έκδοση έρχεται από το package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        # Οι ίδιες ρυθμίσεις με το πραγματικό ανέβασμα (deploy-web.yml), ώστε ο
        # έλεγχος να χτίζει ακριβώς ό,τι χτίζει και η παραγωγή — όχι κάτι άλλο.
        env:
          NEXT_PUBLIC_API_URL: https://staffnow-api-production.siteinside53.workers.dev
          NEXT_PUBLIC_APP_URL: https://staffnow.gr
